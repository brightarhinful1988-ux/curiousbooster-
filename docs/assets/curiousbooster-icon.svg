<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="title" x1="44" y1="28" x2="212" y2="59" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffe76c"/>
      <stop offset=".22" stop-color="#ff927d"/>
      <stop offset=".46" stop-color="#75efdc"/>
      <stop offset=".72" stop-color="#b09aff"/>
      <stop offset="1" stop-color="#ffd66a"/>
    </linearGradient>
    <linearGradient id="shade" x1="128" y1="0" x2="128" y2="102" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101c37" stop-opacity=".88"/>
      <stop offset=".7" stop-color="#142544" stop-opacity=".42"/>
      <stop offset="1" stop-color="#142544" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="photoFrame" x1="8" y1="130" x2="64" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff"/>
      <stop offset=".45" stop-color="#ffcf62"/>
      <stop offset="1" stop-color="#f06453"/>
    </linearGradient>
    <linearGradient id="waterFrame" x1="194" y1="130" x2="250" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff"/>
      <stop offset=".45" stop-color="#74efff"/>
      <stop offset="1" stop-color="#6485ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dy="2" result="offset"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope=".5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="tile">
      <rect width="256" height="256" rx="46"/>
    </clipPath>
    <clipPath id="fireCrop">
      <circle cx="37" cy="164" r="25"/>
    </clipPath>
    <clipPath id="waterCrop">
      <circle cx="219" cy="164" r="25"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="256" height="256" fill="#13294b"/>
    <image href="icon-photo-laptop-books.jpg" x="-49" y="0" width="354" height="256" preserveAspectRatio="xMidYMid slice"/>
    <rect width="256" height="88" fill="url(#shade)"/>
    <rect y="82" width="256" height="174" fill="#173556" opacity=".08"/>
    <text x="128" y="53" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900" letter-spacing="-1.35" fill="#09203b" opacity=".72" transform="translate(0 2)">AMBITIOUS</text>
    <text x="128" y="51" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900" letter-spacing="-1.35" fill="url(#title)" stroke="#fff" stroke-opacity=".8" stroke-width="1.2" paint-order="stroke">AMBITIOUS</text>
    <g filter="url(#shadow)">
      <circle cx="37" cy="164" r="28" fill="url(#photoFrame)"/>
      <g clip-path="url(#fireCrop)">
        <image href="icon-photo-fire.jpg" x="10" y="137" width="54" height="54" preserveAspectRatio="xMidYMid slice"/>
      </g>
      <circle cx="37" cy="164" r="25" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="1"/>
      <circle cx="219" cy="164" r="28" fill="url(#waterFrame)"/>
      <g clip-path="url(#waterCrop)">
        <image href="icon-photo-water-splash.jpg" x="192" y="137" width="54" height="54" preserveAspectRatio="xMidYMid slice"/>
      </g>
      <circle cx="219" cy="164" r="25" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="1"/>
    </g>
    <g transform="translate(128 166)" fill="none" stroke-linecap="round">
      <ellipse rx="26" ry="10.5" stroke="#e9ffff" stroke-width="2.5" transform="rotate(-32)"/>
      <ellipse rx="26" ry="10.5" stroke="#64e6f0" stroke-width="2.1" transform="rotate(32)"/>
      <ellipse rx="26" ry="10.5" stroke="#ffd66a" stroke-width="1.8"/>
      <circle r="4.5" fill="#ffda65" stroke="#fff8cb" stroke-width="1.5"/>
      <circle cx="25" cy="-8" r="2.5" fill="#ff8d83" stroke="#fff" stroke-width=".8"/>
      <circle cx="-13" cy="-21" r="2.4" fill="#72eff0" stroke="#fff" stroke-width=".8"/>
      <circle cx="11" cy="22" r="2.3" fill="#c1a1ff" stroke="#fff" stroke-width=".8"/>
    </g>
    <path d="M0 236c42-9 83-12 128-8 49 4 88 1 128-8v36H0v-20Z" fill="#101d37" opacity=".56"/>
    <path d="M0 238c43-9 86-10 128-6 48 4 88 1 128-8" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="1"/>
  </g>
  <rect x=".75" y=".75" width="254.5" height="254.5" rx="45.25" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.5"/>
</svg>
